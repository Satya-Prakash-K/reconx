apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-engine
  namespace: reconx
  labels:
    app: autonomous-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autonomous-engine
  template:
    metadata:
      labels:
        app: autonomous-engine
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: autonomous-engine
          image: reconx/autonomous-engine:latest
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: reconx-config
            - secretRef:
                name: reconx-secrets
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 8000m
              memory: 16Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: autonomous-engine
  namespace: reconx
spec:
  selector:
    app: autonomous-engine
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autonomous-engine-hpa
  namespace: reconx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autonomous-engine
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
