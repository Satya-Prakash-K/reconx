apiVersion: v2
name: reconx
description: ReconX Autonomous AI Security Operations Platform
type: application
version: 2.0.0
appVersion: "2.0.0"

dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: elasticsearch
    version: "21.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: elasticsearch.enabled

maintainers:
  - name: ReconX Team
