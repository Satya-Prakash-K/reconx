[project]
name = "reconx-vuln-engine"
version = "0.1.0"
description = "ReconX Vulnerability Analysis & Intelligent Fuzzing Engine"
requires-python = ">=3.11"
dependencies = [
    "reconx-shared",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "celery[redis]>=5.3.0",
    "ray[default]>=2.9.0",
    "aiokafka>=0.10.0",
    "httpx>=0.27.0",
    "playwright>=1.41.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pyjwt>=2.8.0",
    "mitmproxy>=10.2.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "jsonschema>=4.21.0",
    "graphql-core>=3.2.0",
    "websockets>=12.0",
    "deepdiff>=6.7.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
