[project]
name = "reconx-worker"
version = "0.1.0"
description = "ReconX Worker — Celery + Temporal task workers"
requires-python = ">=3.11"
dependencies = [
    "reconx-shared",
    "celery[redis]>=5.3.0",
    "temporalio>=1.4.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
