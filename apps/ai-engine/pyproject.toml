[project]
name = "reconx-ai-engine"
version = "0.1.0"
description = "ReconX AI Engine — LLM agents, RAG, scoring"
requires-python = ">=3.11"
dependencies = [
    "reconx-shared",
    "langchain>=0.1.0",
    "langgraph>=0.0.30",
    "crewai>=0.22.0",
    "dspy-ai>=2.4.0",
    "qdrant-client>=1.7.0",
    "openai>=1.12.0",
    "sentence-transformers>=2.5.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
