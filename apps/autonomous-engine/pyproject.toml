[project]
name = "reconx-autonomous"
version = "2.0.0"
description = "ReconX Autonomous AI Security Operations Engine"
requires-python = ">=3.11"
dependencies = [
    "reconx-shared",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "aiokafka>=0.10.0",
    "langgraph>=0.0.40",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "qdrant-client>=1.7.0",
    "neo4j>=5.17.0",
    "elasticsearch[async]>=8.12.0",
    "sentence-transformers>=2.3.0",
    "playwright>=1.41.0",
    "structlog>=24.1.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "jsondiff>=2.0.0",
    "deepdiff>=7.0.0",
    "sslyze>=6.0.0",
    "pyjwt>=2.8.0",
    "pyyaml>=6.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "clickhouse-connect>=0.7.0",
]

[project.scripts]
reconx = "src.cli.main:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
