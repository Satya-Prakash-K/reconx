[project]
name = "reconx-api-gateway"
version = "0.1.0"
description = "ReconX API Gateway — FastAPI + gRPC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "aiokafka>=0.10.0",
    "reconx-shared",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
