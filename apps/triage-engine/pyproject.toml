[project]
name = "reconx-triage-engine"
version = "0.1.0"
description = "ReconX AI Triage, Exploit Intelligence & Report Generation Engine"
requires-python = ">=3.11"
dependencies = [
    "reconx-shared",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "aiokafka>=0.10.0",
    "qdrant-client>=1.7.0",
    "neo4j>=5.17.0",
    "elasticsearch[async]>=8.12.0",
    "sentence-transformers>=2.3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "tiktoken>=0.6.0",
    "pyjwt>=2.8.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "pyyaml>=6.0.0",
    "structlog>=24.1.0",
    "cryptography>=42.0.0",
    "pydantic>=2.6.0",
    "weasyprint>=61.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
